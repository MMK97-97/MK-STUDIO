<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040507">
  <title>Templates — MK97 Creative Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@700;900&family=DM+Sans:wght@500;700;800&family=Inter:wght@400;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=26">
  <style>
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
      margin-bottom: 16px;
    }
    .chip-btn {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-lg);
      background: rgba(16, 20, 28, 0.85);
      border: 1px solid var(--border-card);
      color: #94a3b8;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .chip-btn.active {
      background: var(--gold-gradient);
      color: #050608;
      border-color: var(--gold-primary);
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body data-nav="templates">
  <div class="page">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <a class="icon-btn" href="index.html" aria-label="Back">‹</a>
        <div>
          <b style="font-size:15px;display:block">Templates</b>
          <small style="font-size:8px;color:var(--gold-mid);font-weight:800;letter-spacing:0.05em">1000+ PREMIUM CRICKET TEMPLATES</small>
        </div>
      </div>
      <div class="top-actions">
        <span class="pro-chip">👑 PREMIUM</span>
        <button class="icon-btn" aria-label="Notifications">🔔</button>
      </div>
    </header>

    <main class="shell main">
      <div class="search-bar-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="templateSearch" placeholder="Search cricket templates..." autocomplete="off">
        <button class="filter-icon-btn" title="Filter">⚙</button>
      </div>

      <div class="chips-row" id="categoryChips"></div>

      <div class="section-title-row">
        <div>
          <h3 id="templateCount">1000+ Premium Templates</h3>
          <p style="margin:2px 0 0;font-size:8px;color:var(--text-muted)">Professional designs for creators</p>
        </div>
        <select id="sortSelect" style="background:#121620;border:1px solid var(--border-card);color:#fff;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:800">
          <option>🔥 Most Popular</option>
          <option>✨ Newest</option>
          <option>👑 Premium Pro</option>
        </select>
      </div>

      <div class="trending-grid" id="templateGrid"></div>
    </main>

    <div data-bottomnav></div>
  </div>

  <script src="templates-data.js?v=26"></script>
  <script src="app.js?v=26"></script>
</body>
</html>
